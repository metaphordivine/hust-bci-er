name: repo-guard

on:
  pull_request:
  push:
    branches: [main]

jobs:
  repo-guard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Check repository conventions
        run: python scripts/check_repo_conventions.py

      - name: Validate route configs
        run: python scripts/validate_route.py --all

      - name: Run tests
        run: python -m pytest tests -q

