name: toy-experiment-audit

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/**"
      - "requirements-ci.txt"
      - "pyproject.toml"
      - "scripts/**"
      - "src/hust_bci_er/**"
      - "configs/datasets/toy_eeg_v1.yaml"
      - "configs/splits/toy_subject_holdout_seed42.yaml"
      - "configs/routes/models/toy_eegnet.yaml"
  push:
    branches: [main]

jobs:
  toy-experiment-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install CPU audit environment
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt
          pip install -e .

      - name: Run toy candidate audit
        run: |
          python scripts/launch_reproducible.py --seed 42 -- python scripts/toy_experiment_audit.py --run-dir outputs/toy_eegnet/ci
