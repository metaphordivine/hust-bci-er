route_id: fixed_crop_ea_deformer_mean_pool_control
status: IDEA
dataset_version: train_v1
split_id: p1_seed42_fold0
seed: 42
input_window_sec: 10
preprocessing: [euclidean_alignment, zscore]
features: []
augmentation:
  name: split_first_fixed_crops
  split_first: true
  source_trial_sec: 50
  window_sec: 10
  n_crops: 5
  apply_to_splits: [train, val, test]
  aggregate_to_trial:
    method: mean_score
    tie_break: mean_score
model:
  name: deformer_lite
  conv_channels: 24
  transformer_depth: 2
  num_heads: 4
  embedding_dim: 64
  feedforward_multiplier: 4
  pooling: mean
  classifier_hidden_dim: 32
  dropout: 0.25
adaptation: none
training:
  trainer: torch_classifier
  job_adapter: torch_classifier
  epochs: 80
  batch_size: 16
  optimizer:
    name: adamw
    lr: 0.0005
    weight_decay: 0.005
  loss: cross_entropy
  grad_clip_norm: 1.0
  early_stopping:
    monitor: val_loss
    mode: min
    patience: 20
inference:
  top4: true
  crop_policy: exact_single_crop
evaluation:
  protocol: p1_repeated_group_kfold
  primary_metric: exact_single_crop_expected_BA
notes: "Controlled Deformer ablation from fixed_crop_ea_deformer: mean pooling control instead of attention pooling."

