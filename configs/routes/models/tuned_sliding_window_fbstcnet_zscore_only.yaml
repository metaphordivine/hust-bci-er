route_id: tuned_sliding_window_fbstcnet_zscore_only
status: IDEA
dataset_version: train_v1
split_id: p1_seed42_fold0
seed: 42
input_window_sec: 6
preprocessing: [zscore]
features: []
augmentation:
  name: split_first_sliding_window
  split_first: true
  source_trial_sec: 10
  window_sec: 6
  stride_sec: 1
  search_space:
    window_sec: [6]
    stride_sec: [1]
  apply_to_splits: [train, val, test]
  aggregate_to_trial:
    method: majority_vote
    tie_break: mean_score
model:
  name: fbstcnet
  sfreq: 250
  variant: M
  n_bands: 12
  filterbank_type: cheby2
  filter_order: 4
  stopband_ripple: 30.0
  transition_bandwidth: 2.0
  F1: 32
  F2: 64
  st_alpha: 0.1
  alpha1: 20
  alpha2: 5
  pool_size: 100
  pool_stride: 10
  power_drop_prob: 0.35
  gamma: 300
adaptation: none
training:
  trainer: torch_classifier
  job_adapter: torch_classifier
  epochs: 80
  batch_size: 16
  optimizer:
    name: adamw
    lr: 0.0005
    weight_decay: 0.005
  loss: cross_entropy
  grad_clip_norm: 1.0
  early_stopping:
    monitor: val_loss
    mode: min
    patience: 20
inference:
  top4: true
  crop_policy: sliding_window_vote
evaluation:
  protocol: p1_repeated_group_kfold
  primary_metric: exact_single_crop_expected_BA
notes: "No-EA counterpart for tuned_sliding_window_fbstcnet. Use P3 with configs/search/spaces/sliding_fbstcnet_window_shape.yaml to tune window_sec/stride_sec inside inner folds."

