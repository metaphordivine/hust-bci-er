route_id: sliding_window_conformer_lite
status: IDEA
dataset_version: train_v1
split_id: p1_seed42_fold0
seed: 42
input_window_sec: 4
preprocessing: [zscore]
features: []
augmentation:
  name: split_first_sliding_window
  split_first: true
  source_trial_sec: 10
  window_sec: 4
  stride_sec: 2
  search_space:
    window_sec: [4, 6, 8]
    stride_sec: [1, 2, 4]
  apply_to_splits: [train, val, test]
  aggregate_to_trial:
    method: majority_vote
    tie_break: mean_score
model:
  name: conformer_lite
adaptation: none
training:
  trainer: torch_classifier
  epochs: 80
  batch_size: 32
  optimizer:
    name: adamw
    lr: 0.001
    weight_decay: 0.01
  loss: cross_entropy
  grad_clip_norm: 1.0
  early_stopping:
    monitor: val_loss
    mode: min
    patience: 12
inference:
  top4: true
  crop_policy: sliding_window_vote
evaluation:
  protocol: p1_repeated_group_kfold
  primary_metric: exact_single_crop_expected_BA
notes: split-first sliding-window defaults; tune augmentation.window_sec and augmentation.stride_sec through route search_space.
