route_id: tuned_sliding_window_cbramod_source14_stride2
status: IDEA
dataset_version: train_v1
split_id: p1_seed42_fold0
seed: 42
input_window_sec: 6
preprocessing: [euclidean_alignment, zscore]
features: []
augmentation:
  name: split_first_sliding_window
  split_first: true
  source_trial_sec: 14
  window_sec: 6
  stride_sec: 2
  search_space:
    window_sec: [6]
    stride_sec: [2]
  apply_to_splits: [train, val, test]
  aggregate_to_trial:
    method: majority_vote
    tie_break: mean_score
model:
  name: cbramod
  patch_size: 250
  d_model: 250
  emb_dim: 128
  n_layer: 6
  nhead: 10
  dim_feedforward: 512
  drop_prob: 0.2
  classifier_pooling: mean
adaptation: none
training:
  trainer: torch_classifier
  job_adapter: torch_classifier
  epochs: 80
  batch_size: 16
  optimizer:
    name: adamw
    lr: 0.0003
    weight_decay: 0.005
  loss: cross_entropy
  grad_clip_norm: 1.0
  early_stopping:
    monitor: val_loss
    mode: min
    patience: 20
inference:
  top4: true
  crop_policy: sliding_window_vote
evaluation:
  protocol: p1_repeated_group_kfold
  primary_metric: exact_single_crop_expected_BA
notes: "CBraMod rescue route: tuned sliding-window baseline extended to 14 s source trials with 6 s windows and stride 2, preserving five exact-metric crops. Crop count: (14-6)/2+1=5, which matches the exact_single_crop_expected_BA 5-column score-matrix requirement. Majority-vote crop_policy is used for trial-level prediction; the primary metric is recomputed from the 5-column score matrix exactly as for fixed-crop routes."

