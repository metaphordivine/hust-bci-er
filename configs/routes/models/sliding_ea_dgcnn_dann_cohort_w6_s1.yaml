route_id: sliding_ea_dgcnn_dann_cohort_w6_s1
status: IDEA
dataset_version: train_v1
split_id: p1_seed42_fold0
seed: 42
input_window_sec: 6
preprocessing: [euclidean_alignment, zscore]
features: []
augmentation:
  name: split_first_sliding_window
  split_first: true
  source_trial_sec: 10
  window_sec: 6
  stride_sec: 1
  search_space:
    window_sec: [6]
    stride_sec: [1]
  apply_to_splits: [train, val, test]
  aggregate_to_trial:
    method: majority_vote
    tie_break: mean_score
model:
  name: dgcnn
  channel_montage: hust_30_a2
  node_features: 16
  graph_hidden_dim: 32
  k_order: 3
  temporal_kernel_size: 63
  classifier_hidden_dim: 64
  dropout: 0.4
adaptation:
  name: dann
  domain: cohort
  lambda: 0.05
  hidden_dim: 64
  dropout: 0.2
training:
  trainer: torch_classifier
  job_adapter: torch_classifier
  epochs: 80
  batch_size: 16
  optimizer:
    name: adamw
    lr: 0.0005
    weight_decay: 0.005
  loss: cross_entropy
  grad_clip_norm: 1.0
  early_stopping:
    monitor: val_loss
    mode: min
    patience: 20
inference:
  top4: true
  crop_policy: sliding_window_vote
evaluation:
  protocol: p1_repeated_group_kfold
  primary_metric: exact_single_crop_expected_BA
notes: "Cohort-domain DANN variant of sliding_ea_dgcnn_w6_s1. Uses DEP/HC cohort only as a training-time adversarial domain label to reduce cohort-specific representations; cohort is not used as an inference feature."
