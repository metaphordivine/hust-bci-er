route_id: tuned_sliding_window_cbramod
status: CANDIDATE
dataset_version: train_v1
split_id: p1_seed42_fold0
seed: 42
input_window_sec: 6
preprocessing: [euclidean_alignment, zscore]
features: []
augmentation:
  name: split_first_sliding_window
  split_first: true
  source_trial_sec: 10
  window_sec: 6
  stride_sec: 1
  search_space:
    window_sec: [6]
    stride_sec: [1]
  apply_to_splits: [train, val, test]
  aggregate_to_trial:
    method: majority_vote
    tie_break: mean_score
model:
  name: cbramod
  patch_size: 250
  d_model: 250
  emb_dim: 128
  n_layer: 6
  nhead: 10
  dim_feedforward: 512
  drop_prob: 0.2
  classifier_pooling: mean
adaptation: none
training:
  trainer: torch_classifier
  job_adapter: torch_classifier
  epochs: 80
  batch_size: 16
  optimizer:
    name: adamw
    lr: 0.0003
    weight_decay: 0.005
  loss: cross_entropy
  grad_clip_norm: 1.0
  early_stopping:
    monitor: val_loss
    mode: min
    patience: 20
inference:
  top4: true
  crop_policy: sliding_window_vote
evaluation:
  protocol: p1_repeated_group_kfold
  primary_metric: exact_single_crop_expected_BA
notes: "Sliding-window CBraMod tuning: EA, 250-sample patches, reduced depth, and mean-pooled classifier head."
