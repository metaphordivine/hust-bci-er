route_id: fixed_crop_ea_riemannian_tangent
status: IDEA
dataset_version: train_v1
split_id: p1_seed42_fold0
seed: 42
input_window_sec: 10
preprocessing: [euclidean_alignment, zscore]
features: []
augmentation:
  name: split_first_fixed_crops
  split_first: true
  source_trial_sec: 50
  window_sec: 10
  n_crops: 5
  apply_to_splits: [train, val, test]
  aggregate_to_trial:
    method: mean_score
    tie_break: mean_score
model:
  name: riemannian_tangent
  covariance_eps: 0.001
  shrinkage: 0.1
  tangent_scale: 1.41421356237
  feature_standardize: true
  dropout: 0.0
adaptation: none
training:
  trainer: torch_classifier
  job_adapter: torch_classifier
  epochs: 80
  batch_size: 32
  optimizer:
    name: adamw
    lr: 0.001
    weight_decay: 0.01
  loss: cross_entropy
  grad_clip_norm: 1.0
  early_stopping:
    monitor: val_loss
    mode: min
    patience: 20
inference:
  top4: true
  crop_policy: exact_single_crop
evaluation:
  protocol: p1_repeated_group_kfold
  primary_metric: exact_single_crop_expected_BA
notes: "EA + fixed 5x10s crops for a log-covariance tangent-space linear classifier. Non-deep baseline intended as a reusable score-fusion component and DEPHC imbalance diagnostic."
