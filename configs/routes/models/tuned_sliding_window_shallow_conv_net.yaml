route_id: tuned_sliding_window_shallow_conv_net
status: IDEA
dataset_version: train_v1
split_id: p1_seed42_fold0
seed: 42
input_window_sec: 6
preprocessing: [euclidean_alignment, zscore]
features: []
augmentation:
  name: split_first_sliding_window
  split_first: true
  source_trial_sec: 10
  window_sec: 6
  stride_sec: 1
  search_space:
    window_sec: [6]
    stride_sec: [1]
  apply_to_splits: [train, val, test]
  aggregate_to_trial:
    method: majority_vote
    tie_break: mean_score
model:
  name: shallow_conv_net
  n_filters_time: 64
  filter_time_length: 31
  n_filters_spat: 64
  pool_time_length: 125
  pool_time_stride: 25
  final_conv_length: auto
  batch_norm: true
  batch_norm_alpha: 0.05
  drop_prob: 0.35
adaptation: none
training:
  trainer: torch_classifier
  job_adapter: torch_classifier
  epochs: 80
  batch_size: 32
  optimizer:
    name: adamw
    lr: 0.0005
    weight_decay: 0.005
  loss: cross_entropy
  grad_clip_norm: 1.0
  early_stopping:
    monitor: val_loss
    mode: min
    patience: 20
inference:
  top4: true
  crop_policy: sliding_window_vote
evaluation:
  protocol: p1_repeated_group_kfold
  primary_metric: exact_single_crop_expected_BA
notes: "Sliding-window ShallowConvNet tuning: EA with wider temporal/spatial filters and lower dropout."
