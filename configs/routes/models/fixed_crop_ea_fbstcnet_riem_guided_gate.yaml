route_id: fixed_crop_ea_fbstcnet_riem_guided_gate
status: IDEA
dataset_version: train_v1
split_id: p1_seed42_fold0
seed: 42
input_window_sec: 10
preprocessing: [euclidean_alignment, zscore]
features: []
augmentation:
  name: split_first_fixed_crops
  split_first: true
  source_trial_sec: 50
  window_sec: 10
  n_crops: 5
  apply_to_splits: [train, val, test]
  aggregate_to_trial:
    method: mean_score
    tie_break: mean_score
model:
  name: fbstcnet
  sfreq: 250
  variant: M
  n_bands: 12
  filterbank_type: cheby2
  filter_order: 4
  stopband_ripple: 30.0
  transition_bandwidth: 2.0
  F1: 32
  F2: 64
  st_alpha: 0.1
  alpha1: 20
  alpha2: 5
  pool_size: 100
  pool_stride: 10
  power_drop_prob: 0.35
  gamma: 200
  branch_fusion: riemannian_gate
  gate_hidden_dim: 32
  gate_covariance_eps: 0.001
  gate_shrinkage: 0.1
  gate_tangent_scale: 1.41421356237
  gate_temperature: 1.0
  gate_dropout: 0.1
adaptation: none
training:
  trainer: torch_classifier
  job_adapter: torch_classifier
  epochs: 80
  batch_size: 16
  optimizer:
    name: adamw
    lr: 0.0005
    weight_decay: 0.005
  loss: cross_entropy
  grad_clip_norm: 1.0
  early_stopping:
    monitor: val_loss
    mode: min
    patience: 20
inference:
  top4: true
  crop_policy: exact_single_crop
evaluation:
  protocol: p1_repeated_group_kfold
  primary_metric: exact_single_crop_expected_BA
notes: "EA + fixed 5x10s crops for FBSTCNet-M with a Riemannian tangent-feature gate that learns sample-level power/connectivity branch weights."
