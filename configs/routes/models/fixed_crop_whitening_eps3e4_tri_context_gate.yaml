route_id: fixed_crop_whitening_eps3e4_tri_context_gate
status: IDEA
dataset_version: train_v1
split_id: p1_seed42_fold0
seed: 42
input_window_sec: 10
preprocessing: [whitening_eps3e4]
features: []
augmentation:
  name: split_first_fixed_crops
  split_first: true
  source_trial_sec: 50
  window_sec: 10
  n_crops: 5
  apply_to_splits: [train, val, test]
  aggregate_to_trial:
    method: mean_score
    tie_break: mean_score
model:
  name: tri_context_gate
  srf:
    emb_size: 32
    depth: 2
    num_heads: 4
    patch_size: 32
    dropout: 0.3
    feature_dim: 64
    fft_dropout: 0.35
    fusion_hidden_dim: 64
  fbstcnet:
    sfreq: 250
    variant: M
    n_bands: 12
    filterbank_type: cheby2
    filter_order: 4
    stopband_ripple: 30.0
    transition_bandwidth: 2.0
    F1: 32
    F2: 64
    st_alpha: 0.1
    alpha1: 20
    alpha2: 5
    pool_size: 100
    pool_stride: 10
    power_drop_prob: 0.35
    gamma: 300
  conformer:
    emb_size: 32
    depth: 1
    num_heads: 4
    dropout: 0.35
    conv_dropout: 0.3
  gate_hidden_dim: 24
  gate_dropout: 0.15
  fusion_temperature: 1.0
adaptation: none
training:
  trainer: torch_classifier
  job_adapter: torch_classifier
  epochs: 80
  batch_size: 8
  optimizer:
    name: adamw
    lr: 0.0005
    weight_decay: 0.005
  loss: cross_entropy
  grad_clip_norm: 1.0
  early_stopping:
    monitor: val_loss
    mode: min
    patience: 16
inference:
  top4: true
  crop_policy: exact_single_crop
evaluation:
  protocol: p1_repeated_group_kfold
  primary_metric: exact_single_crop_expected_BA
notes: "IDEA route: fixed-crop whitening eps=3e-4 TriContextGate backbone fusing SRFNet raw/FFT, FBSTCNet power/connectivity, and Conformer local-global logits. Intended screen is P1 seed42 plus P2 before any full promotion."
