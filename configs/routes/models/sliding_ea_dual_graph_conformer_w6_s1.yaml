route_id: sliding_ea_dual_graph_conformer_w6_s1
status: IDEA
dataset_version: train_v1
split_id: p1_seed42_fold0
seed: 42
input_window_sec: 6
preprocessing: [euclidean_alignment, zscore]
features: []
augmentation:
  name: split_first_sliding_window
  split_first: true
  source_trial_sec: 10
  window_sec: 6
  stride_sec: 1
  search_space:
    window_sec: [6]
    stride_sec: [1]
  apply_to_splits: [train, val, test]
  aggregate_to_trial:
    method: majority_vote
    tie_break: mean_score
model:
  name: dual_graph_conformer
  channel_montage: hust_30_a2
  embedding_dim: 48
  graph_hidden_dim: 32
  fusion_dim: 64
  k_order: 3
  num_heads: 4
  transformer_depth: 1
  temporal_kernel_size: 63
  token_count: 16
  classifier_hidden_dim: 64
  dropout: 0.35
adaptation: none
training:
  trainer: torch_classifier
  job_adapter: torch_classifier
  epochs: 80
  batch_size: 12
  optimizer:
    name: adamw
    lr: 0.0005
    weight_decay: 0.005
  loss: cross_entropy
  grad_clip_norm: 1.0
  early_stopping:
    monitor: val_loss
    mode: min
    patience: 18
inference:
  top4: true
  crop_policy: sliding_window_vote
evaluation:
  protocol: p1_repeated_group_kfold
  primary_metric: exact_single_crop_expected_BA
notes: "IDEA route: dual-branch graph-conformer with learnable channel graph and channel-time self-attention over the 6s/1s sliding-window contract."
