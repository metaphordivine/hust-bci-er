route_id: fixed_crop_ea_lggnet
status: IDEA
dataset_version: train_v1
split_id: p1_seed42_fold0
seed: 42
input_window_sec: 10
preprocessing: [euclidean_alignment, zscore]
features: []
augmentation:
  name: split_first_fixed_crops
  split_first: true
  source_trial_sec: 50
  window_sec: 10
  n_crops: 5
  apply_to_splits: [train, val, test]
  aggregate_to_trial:
    method: mean_score
    tie_break: mean_score
model:
  name: lggnet
  channel_montage: hust_30_a2
  n_regions: 5
  temporal_filters: 8
  temporal_kernel_sizes: [31, 63, 125]
  temporal_pool_size: 4
  graph_hidden_dim: 32
  classifier_hidden_dim: 64
  dropout: 0.3
adaptation: none
training:
  trainer: torch_classifier
  job_adapter: torch_classifier
  epochs: 80
  batch_size: 16
  optimizer:
    name: adamw
    lr: 0.0005
    weight_decay: 0.005
  loss: cross_entropy
  grad_clip_norm: 1.0
  early_stopping:
    monitor: val_loss
    mode: min
    patience: 20
inference:
  top4: true
  crop_policy: exact_single_crop
evaluation:
  protocol: p1_repeated_group_kfold
  primary_metric: exact_single_crop_expected_BA
notes: "IDEA route: LGGNet-style multi-scale temporal kernels, HUST 30-channel montage local region aggregation, and learnable global graph. Diagnostic first; full P1 evidence requires protocol runner execution."
