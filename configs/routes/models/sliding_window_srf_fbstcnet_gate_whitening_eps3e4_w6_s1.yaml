route_id: sliding_window_srf_fbstcnet_gate_whitening_eps3e4_w6_s1
status: IDEA
dataset_version: train_v1
split_id: p1_seed42_fold0
seed: 42
input_window_sec: 6
preprocessing: [whitening_eps3e4]
features: []
augmentation:
  name: split_first_sliding_window
  split_first: true
  source_trial_sec: 10
  window_sec: 6
  stride_sec: 1
  search_space:
    window_sec: [6]
    stride_sec: [1]
  apply_to_splits: [train, val, test]
  aggregate_to_trial:
    method: majority_vote
    tie_break: mean_score
model:
  name: srf_fbstcnet_gate
  srf:
    emb_size: 32
    depth: 2
    num_heads: 4
    patch_size: 32
    dropout: 0.3
    feature_dim: 64
    fft_dropout: 0.35
    fusion_hidden_dim: 64
  fbstcnet:
    sfreq: 250
    variant: M
    n_bands: 12
    filterbank_type: cheby2
    filter_order: 4
    stopband_ripple: 30.0
    transition_bandwidth: 2.0
    F1: 32
    F2: 64
    st_alpha: 0.1
    alpha1: 20
    alpha2: 5
    pool_size: 100
    pool_stride: 10
    power_drop_prob: 0.35
    gamma: 300
  gate_hidden_dim: 16
  gate_dropout: 0.15
  fusion_temperature: 1.0
adaptation: none
training:
  trainer: torch_classifier
  job_adapter: torch_classifier
  epochs: 80
  batch_size: 12
  optimizer:
    name: adamw
    lr: 0.0005
    weight_decay: 0.005
  loss: cross_entropy
  grad_clip_norm: 1.0
  early_stopping:
    monitor: val_loss
    mode: min
    patience: 16
inference:
  top4: true
  crop_policy: sliding_window_vote
evaluation:
  protocol: p1_repeated_group_kfold
  primary_metric: exact_single_crop_expected_BA
notes: "IDEA route: sample-level gated backbone combining SRFNet raw/FFT logits with FBSTCNet-M power/connectivity logits under the 6s/1s sliding-window contract. Initial screen is P1 seed42 plus P2 only."
