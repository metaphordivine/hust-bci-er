route_statuses_only: true
note: BLOCKED is an audit decision in configs/audit_decisions.yaml, not a route status.
statuses:
  IDEA:
    meaning: Initial route or research idea.
    can_advance_to: [SMOKE_ONLY, DIAGNOSTIC_ONLY, CANDIDATE, REJECTED, ARCHIVED]
  SMOKE_ONLY:
    meaning: Minimal code path or tiny run passed; not enough evidence for model comparison.
    can_advance_to: [DIAGNOSTIC_ONLY, CANDIDATE, REJECTED, ARCHIVED]
  DIAGNOSTIC_ONLY:
    meaning: Useful for analysis, ablation, or debugging, but not for review.
    can_advance_to: [CANDIDATE, REJECTED, ARCHIVED]
  CANDIDATE:
    meaning: Passed required audit for comparison under the stated protocol.
    can_advance_to: [PROMOTED, REJECTED, ARCHIVED]
  PROMOTED:
    meaning: Recommended by audit for the current review question.
    can_advance_to: [ARCHIVED]
  REJECTED:
    meaning: Rejected by audit or violated a rule.
    can_advance_to: [ARCHIVED]
  ARCHIVED:
    meaning: Record kept for traceability.
    can_advance_to: []
