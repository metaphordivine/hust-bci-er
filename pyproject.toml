[project]
name = "hust-bci-er"
version = "0.1.0"
description = "Clean EEG/BCI emotion-recognition evaluation workspace"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.23",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0",
]
models = [
  "h5py>=3.0",
  "torch>=2.0",
]
tables = [
  "pandas>=1.5",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
